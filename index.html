<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>汤姆猫跑酷学堂 · 边跑边学，快乐成长</title>
  <meta name="description" content="中小学生跑酷闯关学习平台：学生账号登录、老师创建班级发放班级码、从题库布置作业；实时积分榜单、错题修复、课堂竞速，数据云端保存。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
  <!-- ?v= 版本号：每次更新后浏览器一定会拉取新代码，避免手机上还在跑旧版本 -->
  <link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
  <div class="aurora"><span></span><span></span><span></span></div>

  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#/my">
          <div class="brand-mark">🐱</div>
          <div>
            <div class="brand-text">汤姆猫跑酷学堂</div>
            <div class="brand-sub">RUN · LEARN · LEVEL UP</div>
          </div>
        </a>
        <nav class="nav">
          <a href="#/home" data-nav="home">首页</a>
          <a href="#/my" data-nav="my">我的课堂</a>
          <a href="#/leaderboard" data-nav="leaderboard">实时榜单</a>
          <a href="#/guide" data-nav="guide">使用解说</a>
        </nav>
        <div class="topstats">
          <span class="pill" id="topLive" title="数据源状态">🟡 本地模拟</span>
          <span class="pill points">🏆 <b id="topPoints">0</b> 分</span>
          <span class="pill gold">🪙 <b id="topCoins">0</b></span>
          <span class="avatar-chip" data-action="open-account" title="账号设置：改昵称 / 改密码"><span class="avatar" id="topEmoji">🐱</span><span id="topName">未登录</span></span>
          <button class="pill" id="accountBtn" data-action="open-account" title="账号设置：修改密码、绑定信息">⚙️ 账号</button>
          <button class="pill" id="logoutBtn" data-action="logout" title="退出并切换账号">退出</button>
        </div>
      </div>
    </header>

    <main class="page" id="view">
      <div class="card"><div class="skeleton" style="height:22px;width:40%;margin-bottom:14px"></div>
      <div class="skeleton" style="height:14px;width:70%;margin-bottom:8px"></div>
      <div class="skeleton" style="height:14px;width:55%"></div></div>
    </main>

    <nav class="mobile-nav">
      <a href="#/home" data-nav="home"><span class="em">🏠</span>首页</a>
      <a href="#/my" data-nav="my"><span class="em">🎒</span>课堂</a>
      <a href="#/leaderboard" data-nav="leaderboard"><span class="em">🏆</span>榜单</a>
      <a href="#/guide" data-nav="guide"><span class="em">📖</span>解说</a>
      <a href="#/student/garden" data-nav="garden"><span class="em">🏡</span>家园</a>
    </nav>
  </div>

  <!-- 后端 SDK（Supabase），已经放在本地 vendor/ 里，不依赖外部 CDN；
       万一加载失败也没关系：会自动退回单机演示模式 -->
  <script src="vendor/supabase.js?v=10"></script>

  <script src="engine.js?v=10"></script>
  <script src="config.js?v=10"></script>
  <script src="api-offline.js?v=10"></script>
  <script src="backend.js?v=10"></script>
  <script src="api.js?v=10"></script>
  <script src="chat.js?v=10"></script>
  <script src="game.js?v=10"></script>
  <script src="app.js?v=10"></script>
</body>
</html>
